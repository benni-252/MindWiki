appId: de.mindwiki.app
productName: MindWiki
copyright: Copyright © 2026 Benjamin
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MindWiki
  uninstallDisplayName: MindWiki
  artifactName: MindWiki-Setup-${version}.${ext}
portable:
  artifactName: MindWiki-${version}-portable.${ext}
# Updates: Die App liest latest.yml aus den GitHub-Releases (der Workflow lädt sie mit hoch).
publish:
  provider: github
  owner: benni-252
  repo: MindWiki
